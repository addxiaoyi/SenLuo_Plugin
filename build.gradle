plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.2.2"
}

def nmsVersions = [
        nmsV121R1: [path: 'v1_21_R1', dependency: '1.21.1-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R2: [path: 'v1_21_R2', dependency: '1.21.3-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R3: [path: 'v1_21_R3', dependency: '1.21.4-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R4: [path: 'v1_21_R4', dependency: '1.21.5-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R5: [path: 'v1_21_R5', dependency: '1.21.8-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R6: [path: 'v1_21_R6', dependency: '1.21.10-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R7: [path: 'v1_21_R7', dependency: '1.21.11-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV261R1: [path: 'v26_1_R1', dependency: '26.1.2-R0.1-SNAPSHOT', javaVersion: 25],
        nmsV262R1: [path: 'v26_2_R1', dependency: '26.2-R0.1-SNAPSHOT', javaVersion: 25],
]

def craftEngineVersion = providers.gradleProperty('craftEngineVersion').get()

repositories {
    // Spigot BuildTools installs the version-specific NMS dependencies here.
    mavenLocal()
    mavenCentral()
    maven {
        name = "mojangLogging"
        url = 'https://libraries.minecraft.net/'
        content { includeModule('com.mojang', 'logging') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc-nms"
        url = "https://repo.codemc.io/repository/nms/"
    }
    maven {
        name = "xenondevsReleases"
        url = "https://repo.xenondevs.xyz/releases"
    }
    maven {
        url = "https://repo.momirealms.net/releases/"
    }
    maven {
        url = "https://repo.momirealms.net/snapshots/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
    maven {
        name = "ultimateAdvancementAPI"
        url = "https://nexus.frengor.com/repository/public/"
        content { includeGroup('com.frengor') }
    }
}

nmsVersions.each { sourceSetName, version ->
    sourceSets.create(sourceSetName) {
        java.srcDir("src/nms/${version.path}/java")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    mockitoAgent
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.mockito:mockito-core:5.15.2')
    mockitoAgent('org.mockito:mockito-core:5.15.2') { transitive = false }
    testImplementation('org.ow2.asm:asm:9.8')
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation("net.momirealms:craft-engine-core:${craftEngineVersion}")
    testImplementation("net.momirealms:craft-engine-bukkit:${craftEngineVersion}")
    testRuntimeOnly('io.netty:netty-all:4.1.100.Final')
    // CE's published APIs omit relocated classes used by Player method signatures.
    testRuntimeOnly("maven.modrinth:craftengine:${craftEngineVersion}")
    testRuntimeOnly('com.mojang:authlib:7.0.61')
    // Native NBT tag codecs require DynamicOps during the bounded source-reader tests.
    testRuntimeOnly('com.mojang:datafixerupper:8.0.16')
    testRuntimeOnly('com.mojang:logging:1.6.11')
    // CE's block API reads /version.json through a Minecraft class at initialization.
    testRuntimeOnly('org.spigotmc:spigot:1.21.11-R0.1-SNAPSHOT:remapped-mojang') { transitive = false }
    testRuntimeOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    // Optional runtime plugin: never bundle its API or implementation.
    def ultimateApiJar = providers.gradleProperty('ultimateAdvancementApiJar').orNull
    if (ultimateApiJar != null) {
        compileOnly(files(ultimateApiJar))
    } else {
        compileOnly('com.frengor:ultimateadvancementapi:2.8.1') { transitive = false }
    }
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("net.momirealms:craft-engine-bukkit:${craftEngineVersion}")
    compileOnly("net.momirealms:craft-engine-core:${craftEngineVersion}")
    // The published Core API includes CraftEngine's relocated Adventure classes.
    compileOnly("net.momirealms:craft-engine-bukkit-proxy:${craftEngineVersion}")
    compileOnly("net.momirealms:craft-engine-nms-helper-mojmap:1.0.234")
    compileOnly("net.momirealms:craft-engine-nms-helper:1.0.234")
    compileOnly("io.netty:netty-all:4.1.100.Final")
    compileOnly("com.mojang:datafixerupper:8.0.16")
    compileOnly("net.momirealms:sparrow-util:0.112")
    compileOnly("net.momirealms:sparrow-nbt:0.18.8")
    compileOnly("net.momirealms:sparrow-nbt-legacy-codec:0.18.8")
    compileOnly("net.momirealms:sparrow-nbt-codec:0.18.4")
    compileOnly("net.momirealms:sparrow-nbt-adventure:0.18.4")
    compileOnly("net.momirealms:sparrow-heart:0.69")
    compileOnly("net.momirealms:sparrow-metadata:1.13")
    compileOnly("net.momirealms:sparrow-reflection:0.31")
    compileOnly("me.clip:placeholderapi:2.11.6")
    implementation("net.momirealms:antigrieflib:1.0.11")
    implementation("org.bstats:bstats-bukkit:3.2.1")

    nmsVersions.each { sourceSetName, version ->
        def notation = "org.spigotmc:spigot:${version.dependency}"
        if (version.classifier != null) {
            notation += ":${version.classifier}"
        }
        add("${sourceSetName}CompileOnly", notation) {
            transitive = false
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Load Mockito's supported premain agent with the test JVM. Dynamic
    // attachment otherwise starts an extra external JVM and can fail before
    // the first mock is initialized on constrained hosts.
    jvmArgumentProviders.add({ ->
        ["-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"]
    } as org.gradle.process.CommandLineArgumentProvider)
    systemProperty 'file.encoding', 'UTF-8'
    dependsOn(tasks.named('shadowJar'))
    def pluginJar = tasks.named('shadowJar').get().archiveFile
    inputs.file(pluginJar)
    systemProperty 'cookery.pluginJar', pluginJar.get().asFile.absolutePath
    dependsOn('acceptanceJar')
    def acceptanceJarFile = layout.buildDirectory.file('acceptance/probe/CookeryAcceptanceProbe.jar')
    inputs.file(acceptanceJarFile)
    systemProperty 'cookery.acceptanceJar', acceptanceJarFile.get().asFile.absolutePath
}

shadowJar {
    archiveClassifier.set('')
    from(nmsVersions.keySet().collect { sourceSets.named(it).get().output })
    // Paper must not interpret Mojang names as Spigot names and remap them a second time.
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
    // Spigot's compiler JARs retain versioned CraftBukkit packages; Paper 1.21+ does not.
    nmsVersions.values().findAll { it.path.startsWith('v1_21_') }.each { version ->
        relocate "org.bukkit.craftbukkit.${version.path}", 'org.bukkit.craftbukkit'
    }
    relocate 'net.momirealms.antigrieflib', 'net.kaleidoscope.cookery.libs.antigrieflib'
    relocate 'org.bstats', 'net.kaleidoscope.cookery.libs.bstats'
}

jar {
    enabled = false
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
    dependsOn('javadocJar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

nmsVersions.each { sourceSetName, version ->
    if (version.javaVersion != null) {
        tasks.named(sourceSets[sourceSetName].compileJavaTaskName, JavaCompile) {
            options.release.set(21)
            javaCompiler.set(javaToolchains.compilerFor {
                languageVersion = JavaLanguageVersion.of(version.javaVersion)
            })
        }
    }
}

tasks.withType(Javadoc).configureEach {
    // Javadoc parses Gradle's option file inside its own JVM.
    options.jFlags('-Dfile.encoding=COMPAT')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Explicit local acceptance fixture; never included in the distributable plugin.
sourceSets.create('acceptance') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
}

tasks.register('acceptanceJar', Jar) {
    dependsOn(tasks.named('acceptanceClasses'))
    from(sourceSets.acceptance.output)
    archiveFileName.set('CookeryAcceptanceProbe.jar')
    destinationDirectory.set(layout.buildDirectory.dir('acceptance/probe'))
    // The probe's native reflection names already use Mojang mappings. Keep its
    // defining JAR stable instead of sending it through the Spigot remapper.
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
}
